<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="2400" height="1350" fill="#f8fafc"/>

  <!-- Presentation Header Banner -->
  <rect x="50" y="30" width="2300" height="110" rx="16" fill="#ffffff" filter="url(#shadow)" stroke="#e2e8f0" stroke-width="2"/>
  <text x="90" y="78" font-size="28" font-weight="800" fill="#0f172a">DevProfile — End-to-End System Activity Diagram</text>
  <text x="90" y="112" font-size="16" font-weight="500" fill="#64748b">Unified Activity Lifecycle Across Actors: Student (Web) • VS Code Extension • Backend Engine &amp; Cron • Recruiter / Peer</text>

  <!-- Legend Badges on Header -->
  <g transform="translate(1420, 52)">
    <rect x="0" y="0" width="180" height="36" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="7" fill="#3b82f6"/>
    <text x="36" y="23" font-size="13" font-weight="700" fill="#1d4ed8">Actor 1: Student</text>

    <rect x="195" y="0" width="195" height="36" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="215" cy="18" r="7" fill="#8b5cf6"/>
    <text x="231" y="23" font-size="13" font-weight="700" fill="#5b21b6">Actor 2: Extension</text>

    <rect x="405" y="0" width="200" height="36" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="425" cy="18" r="7" fill="#22c55e"/>
    <text x="441" y="23" font-size="13" font-weight="700" fill="#15803d">Actor 3 &amp; 4: Backend</text>

    <rect x="620" y="0" width="185" height="36" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <circle cx="640" cy="18" r="7" fill="#f97316"/>
    <text x="656" y="23" font-size="13" font-weight="700" fill="#c2410c">Actor 5: Recruiter</text>
  </g>

  <!-- COLUMN 1: STAGE 1 - SETUP & DATA INGESTION -->
  <rect x="50" y="165" width="530" height="1135" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="165" width="530" height="60" rx="16" fill="#3b82f6"/>
  <rect x="50" y="205" width="530" height="20" fill="#3b82f6"/>
  <text x="80" y="204" font-size="18" font-weight="800" fill="#ffffff">PHASE 1: Onboarding &amp; Data Ingestion</text>

  <rect x="245" y="255" width="140" height="42" rx="21" fill="#0f172a"/>
  <circle cx="270" cy="276" r="8" fill="#22c55e"/>
  <text x="290" y="282" font-size="15" font-weight="700" fill="#ffffff">START</text>

  <line x1="315" y1="297" x2="315" y2="330" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(90, 330)">
    <rect width="450" height="95" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="16" y="14" width="85" height="22" rx="6" fill="#dbeafe"/>
    <text x="24" y="29" font-size="11" font-weight="700" fill="#1d4ed8">STUDENT</text>
    <text x="16" y="56" font-size="15" font-weight="700" fill="#0f172a">1. Register or Log in</text>
    <text x="16" y="78" font-size="13" fill="#475569">Enter Email, GitHub handle, or LeetCode username</text>
  </g>

  <line x1="315" y1="425" x2="315" y2="465" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="325" y="448" font-size="11" font-weight="600" fill="#3b82f6">Auth Trigger</text>

  <g transform="translate(90, 465)">
    <rect width="450" height="115" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="16" y="14" width="90" height="22" rx="6" fill="#dcfce7"/>
    <text x="24" y="29" font-size="11" font-weight="700" fill="#15803d">BACKEND</text>
    <text x="16" y="56" font-size="15" font-weight="700" fill="#0f172a">2. Live Platform Sync</text>
    <text x="16" y="78" font-size="13" fill="#475569">• GitHub REST API: Repos, Commits, PRs</text>
    <text x="16" y="98" font-size="13" fill="#475569">• LeetCode GraphQL API: Solves, Topics &amp; Streak</text>
  </g>

  <line x1="315" y1="580" x2="315" y2="620" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <g transform="translate(90, 620)">
    <rect width="450" height="105" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="16" y="14" width="90" height="22" rx="6" fill="#dcfce7"/>
    <text x="24" y="29" font-size="11" font-weight="700" fill="#15803d">DATABASE</text>
    <text x="16" y="56" font-size="15" font-weight="700" fill="#0f172a">3. Seed Initial 30-Day Activity</text>
    <text x="16" y="78" font-size="13" fill="#475569">• Store initial snapshots in SQLite (WAL mode)</text>
    <text x="16" y="98" font-size="13" fill="#475569">• Set default daily goals (2 solves, 3 commits, 60m)</text>
  </g>

  <line x1="315" y1="725" x2="315" y2="765" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <g transform="translate(90, 765)">
    <rect width="450" height="95" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="16" y="14" width="85" height="22" rx="6" fill="#dbeafe"/>
    <text x="24" y="29" font-size="11" font-weight="700" fill="#1d4ed8">STUDENT</text>
    <text x="16" y="56" font-size="15" font-weight="700" fill="#0f172a">4. Receive Session JWT &amp; API Key</text>
    <text x="16" y="78" font-size="13" fill="#475569">Store JWT in localStorage; copy API key for VS Code</text>
  </g>

  <path d="M 540 812 L 610 812 L 610 375 L 670 375" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-blue)"/>
  <text x="560" y="570" font-size="12" font-weight="700" fill="#2563eb" transform="rotate(-90 560 570)">Populate Live Data</text>

  <!-- COLUMN 2: STAGE 2 - CODING & TELEMETRY -->
  <rect x="630" y="165" width="530" height="1135" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="630" y="165" width="530" height="60" rx="16" fill="#8b5cf6"/>
  <rect x="630" y="205" width="530" height="20" fill="#8b5cf6"/>
  <text x="660" y="204" font-size="18" font-weight="800" fill="#ffffff">PHASE 2: Active Coding &amp; Live Telemetry</text>

  <g transform="translate(670, 330)">
    <rect width="450" height="95" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="16" y="14" width="85" height="22" rx="6" fill="#dbeafe"/>
    <text x="24" y="29" font-size="11" font-weight="700" fill="#1d4ed8">STUDENT</text>
    <text x="16" y="56" font-size="15" font-weight="700" fill="#0f172a">5. View Dashboard &amp; AI Daily Plan</text>
    <text x="16" y="78" font-size="13" fill="#475569">Inspect merged heatmap, streak, and 3 daily focus tasks</text>
  </g>

  <line x1="895" y1="425" x2="895" y2="465" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(670, 465)">
    <rect width="450" height="105" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="16" y="14" width="95" height="22" rx="6" fill="#ede9fe"/>
    <text x="24" y="29" font-size="11" font-weight="700" fill="#5b21b6">EXTENSION</text>
    <text x="16" y="56" font-size="15" font-weight="700" fill="#0f172a">6. Background Session Tracker</text>
    <text x="16" y="78" font-size="13" fill="#475569">• Listens to document edits, saves &amp; focus changes</text>
    <text x="16" y="98" font-size="13" fill="#475569">• Aggregates duration by language &amp; project name</text>
  </g>

  <line x1="895" y1="570" x2="895" y2="610" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(670, 610)">
    <rect width="450" height="105" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="16" y="14" width="95" height="22" rx="6" fill="#ede9fe"/>
    <text x="24" y="29" font-size="11" font-weight="700" fill="#5b21b6">EXTENSION</text>
    <text x="16" y="56" font-size="15" font-weight="700" fill="#0f172a">7. Problem Timer &amp; Difficulty Feedback</text>
    <text x="16" y="78" font-size="13" fill="#475569">• devprofile.startProblem &amp; markSolved commands</text>
    <text x="16" y="98" font-size="13" fill="#475569">• Prompts user: Easy / Medium / Hard / Struggled</text>
  </g>

  <line x1="895" y1="715" x2="895" y2="760" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(895, 830)">
    <polygon points="0,-60 130,0 0,60 -130,0" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" filter="url(#cardShadow)"/>
    <text x="0" y="-12" font-size="14" font-weight="800" fill="#92400e" text-anchor="middle">Struggle Detected?</text>
    <text x="0" y="10" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">> 40 min (2400s) OR</text>
    <text x="0" y="28" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">Rated 'Struggled'</text>
  </g>

  <path d="M 1025 830 L 1110 830 L 1110 655 L 1250 655" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1050" y="818" font-size="12" font-weight="800" fill="#dc2626">YES (Struggled)</text>

  <path d="M 895 890 L 895 950 L 1250 950 L 1250 420 L 1290 420" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
  <text x="910" y="940" font-size="12" font-weight="800" fill="#16a34a">NO (Normal Time)</text>

  <!-- COLUMN 3: STAGE 3 - COGNITIVE ANALYSIS & REVIEW -->
  <rect x="1210" y="165" width="530" height="1135" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1210" y="165" width="530" height="60" rx="16" fill="#16a34a"/>
  <rect x="1210" y="205" width="530" height="20" fill="#16a34a"/>
  <text x="1240" y="204" font-size="18" font-weight="800" fill="#ffffff">PHASE 3: Cognitive Analysis &amp; Retention</text>

  <g transform="translate(1250, 330)">
    <rect width="450" height="115" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="16" y="14" width="90" height="22" rx="6" fill="#dcfce7"/>
    <text x="24" y="29" font-size="11" font-weight="700" fill="#15803d">ANALYSIS</text>
    <text x="16" y="56" font-size="15" font-weight="700" fill="#0f172a">8. Calculate Daily Consistency Score</text>
    <text x="16" y="78" font-size="13" font-weight="600" fill="#16a34a">Score (0–100) = LeetCode(40) + GitHub(30) + Coding(30)</text>
    <text x="16" y="98" font-size="12" fill="#475569">Active Day if Score ≥ 30; 1 freeze day per 7 days allowed</text>
  </g>

  <line x1="1475" y1="445" x2="1475" y2="485" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <g transform="translate(1250, 485)">
    <rect width="450" height="115" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="16" y="14" width="90" height="22" rx="6" fill="#dcfce7"/>
    <text x="24" y="29" font-size="11" font-weight="700" fill="#15803d">DIAGNOSTIC</text>
    <text x="16" y="56" font-size="15" font-weight="700" fill="#0f172a">9. Weakness Diagnostic Engine</text>
    <text x="16" y="78" font-size="12" font-weight="600" fill="#16a34a">Weakness = 1.5×Deficit + 10×(1-AdvRatio) + StrugglePenalty</text>
    <text x="16" y="98" font-size="12" fill="#475569">Aggregates snapshot tags, solve times, and struggle count</text>
  </g>

  <line x1="1475" y1="600" x2="1475" y2="640" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <g transform="translate(1250, 640)">
    <rect width="450" height="115" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="16" y="14" width="90" height="22" rx="6" fill="#dcfce7"/>
    <text x="24" y="29" font-size="11" font-weight="700" fill="#15803d">SCHEDULER</text>
    <text x="16" y="56" font-size="15" font-weight="700" fill="#0f172a">10. Spaced Repetition Review Queue</text>
    <text x="16" y="78" font-size="13" font-weight="600" fill="#15803d">Interval Stages: 3 Days ➔ 7 Days ➔ 21 Days ➔ 30 Days</text>
    <text x="16" y="98" font-size="12" fill="#475569">Failed review automatically resets back to 3 days</text>
  </g>

  <line x1="1475" y1="755" x2="1475" y2="795" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(1250, 795)">
    <rect width="450" height="95" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="16" y="14" width="85" height="22" rx="6" fill="#dbeafe"/>
    <text x="24" y="29" font-size="11" font-weight="700" fill="#1d4ed8">STUDENT</text>
    <text x="16" y="56" font-size="15" font-weight="700" fill="#0f172a">11. Complete Due Reviews &amp; Add Notes</text>
    <text x="16" y="78" font-size="13" fill="#475569">Mark passed (advances stage) or failed (resets to 3d)</text>
  </g>

  <g transform="translate(1250, 930)">
    <rect width="450" height="85" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="16" y="32" font-size="13" font-weight="700" fill="#475569">⏰ 00:05 AM Nightly Automation (Cron)</text>
    <text x="16" y="54" font-size="12" fill="#64748b">• Batch sync all users' GitHub &amp; LeetCode data</text>
    <text x="16" y="72" font-size="12" fill="#64748b">• Prune raw coding_sessions older than 90 days</text>
  </g>

  <!-- COLUMN 4: STAGE 4 - VERIFICATION & PORTFOLIO -->
  <rect x="1790" y="165" width="560" height="1135" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1790" y="165" width="560" height="60" rx="16" fill="#ea580c"/>
  <rect x="1790" y="205" width="560" height="20" fill="#ea580c"/>
  <text x="1820" y="204" font-size="18" font-weight="800" fill="#ffffff">PHASE 4: Proof of Work &amp; Verification</text>

  <g transform="translate(1840, 330)">
    <rect width="460" height="105" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="16" y="14" width="85" height="22" rx="6" fill="#dbeafe"/>
    <text x="24" y="29" font-size="11" font-weight="700" fill="#1d4ed8">STUDENT</text>
    <text x="16" y="56" font-size="15" font-weight="700" fill="#0f172a">12. Anti-Fabrication LinkedIn Drafts</text>
    <text x="16" y="78" font-size="13" fill="#475569">• Weekly summary &amp; project feature updates</text>
    <text x="16" y="98" font-size="13" font-weight="600" fill="#2563eb">Strictly bound to verified SQL database facts</text>
  </g>

  <line x1="2070" y1="435" x2="2070" y2="475" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(1840, 475)">
    <rect width="460" height="95" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="16" y="14" width="85" height="22" rx="6" fill="#dbeafe"/>
    <text x="24" y="29" font-size="11" font-weight="700" fill="#1d4ed8">STUDENT</text>
    <text x="16" y="56" font-size="15" font-weight="700" fill="#0f172a">13. Configure Portfolio Privacy</text>
    <text x="16" y="78" font-size="13" fill="#475569">Toggle is_public flag in settings (1=Public, 0=Private)</text>
  </g>

  <line x1="2070" y1="570" x2="2070" y2="620" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(1840, 620)">
    <rect width="460" height="95" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="16" y="14" width="85" height="22" rx="6" fill="#ffedd5"/>
    <text x="24" y="29" font-size="11" font-weight="700" fill="#c2410c">RECRUITER</text>
    <text x="16" y="56" font-size="15" font-weight="700" fill="#0f172a">14. Recruiter / Peer Accesses URL</text>
    <text x="16" y="78" font-size="13" fill="#475569">Navigates to /portfolio/:publicSlug (No login required)</text>
  </g>

  <line x1="2070" y1="715" x2="2070" y2="760" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(2070, 830)">
    <polygon points="0,-50 120,0 0,50 -120,0" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" filter="url(#cardShadow)"/>
    <text x="0" y="-8" font-size="14" font-weight="800" fill="#92400e" text-anchor="middle">Is Portfolio</text>
    <text x="0" y="12" font-size="14" font-weight="800" fill="#92400e" text-anchor="middle">Set Public?</text>
  </g>

  <line x1="2190" y1="830" x2="2250" y2="830" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="2250" y1="830" x2="2250" y2="920" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="2200" y="818" font-size="12" font-weight="800" fill="#16a34a">YES</text>

  <line x1="1950" y1="830" x2="1890" y2="830" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="1890" y1="830" x2="1890" y2="920" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1905" y="818" font-size="12" font-weight="800" fill="#dc2626">NO</text>

  <g transform="translate(1810, 920)">
    <rect width="180" height="75" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="16" y="32" font-size="14" font-weight="700" fill="#b91c1c">404 Not Found</text>
    <text x="16" y="54" font-size="11" fill="#7f1d1d">Profile is Private</text>
  </g>

  <g transform="translate(2010, 920)">
    <rect width="320" height="105" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <rect x="12" y="10" width="80" height="20" rx="4" fill="#dcfce7"/>
    <text x="18" y="24" font-size="10" font-weight="800" fill="#15803d">VERIFIED</text>
    <text x="12" y="48" font-size="14" font-weight="700" fill="#0f172a">Verified Public Portfolio</text>
    <text x="12" y="68" font-size="11" fill="#475569">• Authenticated LeetCode counts</text>
    <text x="12" y="86" font-size="11" fill="#475569">• Real GitHub commit history &amp; skills</text>
  </g>

  <rect x="2010" y="1055" width="120" height="40" rx="20" fill="#0f172a"/>
  <circle cx="2032" cy="1075" r="7" fill="#ef4444"/>
  <text x="2050" y="1080" font-size="14" font-weight="700" fill="#ffffff">END</text>

  <line x1="2170" y1="1025" x2="2170" y2="1075" stroke="#475569" stroke-width="2"/>
  <line x1="2170" y1="1075" x2="2140" y2="1075" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1900" y1="995" x2="1900" y2="1075" stroke="#475569" stroke-width="2"/>
  <line x1="1900" y1="1075" x2="2000" y2="1075" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

</svg>